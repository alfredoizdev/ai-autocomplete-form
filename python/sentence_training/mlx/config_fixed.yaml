# MLX LoRA Training Configuration - Fixed for new MLX version
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
train: true

# Data configuration - MLX expects this format
data: "python/sentence_training/mlx"  # Directory containing train.jsonl, valid.jsonl, test.jsonl

# LoRA adapter configuration
adapter_path: "models/bio-sentence-llama3-lora-continued"
resume_adapter_file: "models/bio-sentence-llama3-lora/0000100_adapters.safetensors"

# Training hyperparameters
seed: 42
batch_size: 4
iters: 900  # Remaining iterations
learning_rate: 1e-4
save_every: 100

# LoRA parameters
lora_parameters:
  rank: 16
  alpha: 16
  scale: 10.0
  dropout: 0.1
  keys: ["self_attn.q_proj", "self_attn.v_proj", "self_attn.k_proj", "self_attn.o_proj"]