# MLX LoRA Training Configuration for Bio Sentence Completion
# High-quality sentence-based training for natural completions

# Model configuration
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
tokenizer_config: {}
trust_remote_code: true

# Training data paths
train: "/Users/simonlacey/Documents/GitHub/llms/ai-train-llm/python/sentence_training/mlx/train.jsonl"
valid: "/Users/simonlacey/Documents/GitHub/llms/ai-train-llm/python/sentence_training/mlx/valid.jsonl" 
test: "/Users/simonlacey/Documents/GitHub/llms/ai-train-llm/python/sentence_training/mlx/test.jsonl"

# LoRA adapter configuration
adapter_path: "/Users/simonlacey/Documents/GitHub/llms/ai-train-llm/models/bio-sentence-llama3-lora"
resume_adapter_path: "/Users/simonlacey/Documents/GitHub/llms/ai-train-llm/models/bio-sentence-llama3-lora/0000100_adapters.safetensors"

# Training hyperparameters
seed: 42
num_layers: 16  # Number of layers to apply LoRA to
batch_size: 4
iters: 900  # Remaining iterations (already completed 100)
val_batches: 25
learning_rate: 1e-4  # Conservative learning rate
warmup_steps: 100
save_every: 200
test_every: 200

# LoRA specific parameters
lora_rank: 16  # Higher rank for more expressiveness
lora_alpha: 16
lora_dropout: 0.1
lora_keys: ["self_attn.q_proj", "self_attn.v_proj", "self_attn.k_proj", "self_attn.o_proj"]

# Data processing
max_seq_length: 256  # Shorter sequences for sentence completion
train_on_completions: true  # Only train on the completion part

# Model saving
save_safetensors: true

# Training optimizations
grad_checkpoint: false  # Disable for faster training with smaller model
use_dora: false  # Disable DoRA for stability