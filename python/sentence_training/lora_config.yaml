# MLX LoRA Training Configuration
model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
adapter_path: "models/bio-sentence-llama3-lora"

# Data configuration
data: "python/sentence_training"  # Directory containing data/ subfolder with train.jsonl, valid.jsonl, test.jsonl

# Training parameters
seed: 42
batch_size: 4
iters: 1000
val_batches: 25
learning_rate: 1e-4
warmup_steps: 100
save_every: 200

# LoRA parameters
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.1
num_layers: 16

# Data processing
max_seq_length: 256
train_on_completions: true

# Model saving
save_safetensors: true