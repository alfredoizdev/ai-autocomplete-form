adapter_path: ./adapters/bio_mistral_fresh
batch_size: 2
data: ./bio_dataset
eval_steps: 200
gradient_accumulation_steps: 4
gradient_checkpointing: true
iters: 3000
learning_rate: 5.0e-05
lora_layers: 16
lora_parameters:
  alpha: 32
  dropout: 0.1
  rank: 16
  scale: 10.0
  target_modules:
  - q_proj
  - v_proj
  - k_proj
  - o_proj
max_seq_length: 512
model: mlx-community/Mistral-7B-Instruct-v0.2-4bit
save_every: 500
seed: 42
test_every: 1000
train: true
warmup_steps: 100
